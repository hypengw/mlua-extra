[package]
name = "mlua-extra"
version = "0.1.0"
edition = "2021"
description = "Neutral mlua bindings."
license = "MIT"

[dependencies]
base64 = "0.22"
mlua = { version = "0.10", features = ["lua54", "vendored", "send", "async", "serialize"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "json",
] }
scraper = "0.21"
serde = "1.0"
serde_json = "1.0"
serde_urlencoded = "0.7"
url = "2"
log = "0.4"
